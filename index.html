<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Hour - Arena18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --noir:      #0d0d0d;
    --blanc:     #FFFFFF;
    --cyan:      #0CC0DF;
    --cyan-deep: #0097B2;
    --or:        #D4A843;
    --or-light:  #F0C866;
    --gris-mid:  #777777;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Montserrat', sans-serif;
    background:var(--noir); color:var(--blanc);
    -webkit-font-smoothing:antialiased;
  }
  .screen {
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .bg-image {
    position:absolute; inset:0; z-index:0;
    background-image: url('1.svg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }
  .slide-overlay {
    position:absolute; inset:0; z-index:1;
    background: linear-gradient(180deg,
      rgba(13,13,13,.78) 0%,
      rgba(13,13,13,.48) 45%,
      rgba(13,13,13,.78) 100%
    );
  }

  .line-top {
    position:absolute; top:0; left:0; right:0; height:3px; z-index:10;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--or), var(--cyan), transparent);
    opacity:.85;
  }
  .scanlines {
    position:absolute; inset:0; z-index:5; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
  }
  .bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:6; }
  .bubble {
    position:absolute; bottom:-60px; border-radius:50%;
    background:rgba(12,192,223,.12); border:1px solid rgba(12,192,223,.28);
    animation:rise linear infinite;
  }
  @keyframes rise {
    0%   { opacity:0; transform:scale(.5) translateX(0); }
    8%   { opacity:.9; }
    92%  { opacity:.2; }
    100% { bottom:110%; opacity:0; transform:scale(1.1) translateX(12px); }
  }
  .content {
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; width:100%; padding:24px 48px;
  }
  .live-badge {
    display:inline-flex; align-items:center; gap:9px;
    font-size:clamp(10px,1.1vw,15px); font-weight:700;
    letter-spacing:.45em; text-transform:uppercase; color:var(--or);
    margin-bottom:clamp(4px,1vh,12px);
  }
  .live-badge::before {
    content:''; width:9px; height:9px; border-radius:50%;
    background:var(--or); flex-shrink:0;
    animation:livepulse 1.2s ease-in-out infinite;
  }
  @keyframes livepulse {
    0%,100% { box-shadow:0 0 0 0 rgba(212,168,67,.6); }
    50%     { box-shadow:0 0 0 7px rgba(212,168,67,0); }
  }
  .hh-title {
    font-size:clamp(48px,9vw,120px); font-weight:900;
    text-transform:uppercase; letter-spacing:-.03em; line-height:.88;
    background:linear-gradient(135deg, var(--cyan-deep) 0%, var(--cyan) 45%, #8CF2FF 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    animation:glowpulse 2.8s ease-in-out infinite;
    margin-bottom:clamp(6px,1.2vh,18px);
  }
  @keyframes glowpulse {
    0%,100% { filter:drop-shadow(0 0 35px rgba(12,192,223,.5)); }
    50%     { filter:drop-shadow(0 0 90px rgba(12,192,223,1)); }
  }
  .sub {
    font-size:clamp(11px,1.4vw,18px); font-weight:700;
    letter-spacing:.38em; text-transform:uppercase; color:rgba(255,255,255,.45);
    margin-bottom:clamp(2px,.8vh,10px);
  }
  .cd { display:flex; align-items:flex-end; gap:clamp(4px,1vw,20px); margin:clamp(2px,.8vh,12px) 0; }
  .cd-block { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .cd-num {
    font-size:clamp(60px,13vw,170px); font-weight:900;
    line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums;
    color:var(--cyan); min-width:2.1ch;
    text-shadow:0 0 80px rgba(12,192,223,.7),0 0 20px rgba(12,192,223,.4),0 8px 30px rgba(0,0,0,.9);
  }
  .cd-unit {
    font-size:clamp(9px,1vw,14px); font-weight:700;
    letter-spacing:.32em; text-transform:uppercase; color:rgba(255,255,255,.4);
  }
  .cd-sep {
    font-size:clamp(45px,9.5vw,130px); font-weight:900;
    color:var(--cyan); line-height:1; opacity:.5;
    margin-bottom:clamp(16px,3vh,38px);
    animation:blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity:.5; }
    50%     { opacity:.07; }
  }
  .prog-wrap { width:clamp(260px,62vw,820px); margin:clamp(2px,.6vh,8px) 0; }
  .prog-track { height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
  .prog-fill {
    height:100%;
    background:linear-gradient(90deg, var(--cyan-deep), var(--cyan) 60%, var(--or));
    border-radius:3px; transition:width 1s linear;
    box-shadow:0 0 14px rgba(12,192,223,.65);
  }
  .tarifs {
    display:flex; gap:clamp(8px,1.5vw,20px);
    flex-wrap:wrap; justify-content:center;
    margin:clamp(6px,1.2vh,16px) 0;
  }
  .tarif {
    background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
    border:1px solid rgba(12,192,223,.22);
    padding:clamp(8px,1.1vw,16px) clamp(12px,1.8vw,26px);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    position:relative; overflow:hidden; min-width:clamp(78px,9vw,120px);
  }
  .tarif::after {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent); opacity:.6;
  }
  .tarif-name {
    font-size:clamp(8px,1vw,13px); font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--blanc); white-space:nowrap;
  }
  .tarif-price { font-size:clamp(18px,3.2vw,42px); font-weight:900; color:var(--or-light); line-height:1.05; }
  .tarif-sub { font-size:clamp(7px,.75vw,10px); color:var(--gris-mid); letter-spacing:.08em; text-transform:uppercase; }
  .logo { margin-top:clamp(4px,.8vh,12px); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .logo-tagline {
    font-size:clamp(7px,.8vw,11px); font-weight:700;
    letter-spacing:.45em; text-transform:uppercase; color:rgba(200,200,200,.45);
  }
  #clock {
    position:absolute; bottom:18px; right:26px; z-index:20;
    font-size:clamp(11px,1vw,16px); font-weight:500;
    letter-spacing:.08em; font-variant-numeric:tabular-nums; color:rgba(255,255,255,.18);
  }
  #s-off {
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; gap:12px; padding:32px 48px;
  }
  .off-title {
    font-size:clamp(52px,10vw,130px); font-weight:900;
    text-transform:uppercase; letter-spacing:-.03em; line-height:.88;
    background:linear-gradient(135deg, var(--cyan-deep), var(--cyan) 45%, #8CF2FF);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 40px rgba(12,192,223,.5));
  }
  .off-info {
    font-size:clamp(13px,1.8vw,24px); font-weight:700;
    letter-spacing:.1em; color:rgba(255,255,255,.45); text-transform:uppercase; margin-top:8px;
  }
  .off-info span { color:var(--blanc); }
</style>
</head>

<div class="screen">
  <div class="bg-image"></div>

  <div class="line-top"></div>

  <div class="bubbles" id="bubbles"></div>

  <div class="content" id="s-on" style="display:none;">
    <div class="live-badge">Happy Hour en cours</div>

    <div class="logo">
      <img class="logo-img" alt="Arena18" style="height:clamp(90px,13vh,200px);width:auto;filter:drop-shadow(0 0 18px rgba(12,192,223,.4));">
      <div class="logo-tagline">Vous de jouer</div>
    </div>
  </div>

  <div id="s-off">
    <div class="off-title">Happy Hour</div>
    <div class="off-info">Tous les jeudis <span>17h &rarr; 21h</span></div>
    <div class="logo" style="margin-top:28px;">
      <img class="logo-img" alt="Arena18" style="height:clamp(90px,13vh,200px);width:auto;filter:drop-shadow(0 0 18px rgba(12,192,223,.4));">
      <div class="logo-tagline">Vous de jouer</div>
    </div>
  </div>

  <div id="clock">--:--:--</div>
</div>

  document.querySelectorAll('.logo-img').forEach(img => img.src = LOGO_SRC);
  const wrap = document.getElementById('bubbles');
  for (let i = 0; i < 22; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const sz = 7 + Math.random() * 16;
    b.style.cssText = 'left:' + (Math.random()*100) + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + (9+Math.random()*14) + 's;animation-delay:' + (Math.random()*12) + 's;';
    wrap.appendChild(b);
  }

  const START = 17, END = 21, TOTAL = (END - START) * 3600;
  const pad = n => String(Math.floor(n)).padStart(2, '0');
  const sOn  = document.getElementById('s-on');
  const sOff = document.getElementById('s-off');

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    document.getElementById('clock').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);

    const active = h < END; // PREVIEW -- remettre en prod: now.getDay()===4 && h>=START && h<END
    const secEnd = END * 3600;
    const secOfDay = h*3600 + m*60 + s;

    if (active) {
      sOn.style.display  = 'flex';
      sOff.style.display = 'none';
      const rem = secEnd - secOfDay;
      document.getElementById('cd-h').textContent = pad(rem / 3600);
      document.getElementById('cd-m').textContent = pad((rem % 3600) / 60);
      document.getElementById('cd-s').textContent = pad(rem % 60);
      document.getElementById('prog').style.width = Math.min(100, ((TOTAL - rem) / TOTAL) * 100) + '%';
    } else {
      sOn.style.display  = 'none';
      sOff.style.display = 'flex';
    }
  }

  tick();
  setInterval(tick, 1000);
</script>
